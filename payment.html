<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UGC API Calculator - Secure Checkout</title>

<style>
    :root {
        --primary-gradient: radial-gradient(circle, #c551ef, #0000ff);
        --success-green: #2bda54;
        --dark-overlay: rgba(0, 0, 0, 0.7);
    }

    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }

    .modal-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        display: flex; justify-content: center; align-items: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .modal-content {
        background-image: var(--primary-gradient);
        padding: 40px;
        border-radius: 50px;
        width: 480px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        color: white;
        transition: transform 0.3s ease;
    }

    .payment-form-container {
        margin-top: 20px;
        background: rgba(255, 255, 255, 0.1);
        padding: 20px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.3);
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border-radius: 6px;
        border: none;
        box-sizing: border-box;
    }

    .method-card {
        display: flex;
        align-items: center;
        padding: 15px;
        border: 2px solid rgba(255,255,255,0.2);
        border-radius: 12px;
        margin-bottom: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .method-card.selected {
        border-color: #ffffff; 
        background-color: rgba(255,255,255,0.2);
        box-shadow: 0 0 15px rgba(255,255,255,0.3);
    }

    .method-title { font-weight: bold; margin: 0; }
    .method-sub { font-size: 0.8rem; opacity: 0.8; margin: 0; }
    .icon { font-size: 1.5rem; margin-right: 15px; }

    .pay-now-btn {
        width: 100%;
        padding: 16px;
        background: var(--success-green);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        margin-top: 20px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .pay-now-btn:disabled { background: #888; cursor: not-allowed; }

    #loader {
        display: none;
        text-align: center;
        margin-top: 10px;
    }

    .spinner {
        width: 30px; height: 30px;
        border: 4px solid rgba(255,255,255,0.3);
        border-top: 4px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        display: inline-block;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="modal-overlay">
    <div class="modal-content" id="mainContainer">
        <h2 style="margin-top:0">Secure Checkout</h2>
        <p>Final Amount: <strong style="font-size: 1.5rem;">₹1.00</strong></p>

        <div class="method-card selected">
            <div class="icon">📱</div>
            <div class="details">
                <p class="method-title">UPI / Mobile Wallet</p>
                <p class="method-sub">Google Pay, PhonePe, WhatsApp</p>
            </div>
        </div>

        <div id="upiForm" class="payment-form-container">
            <p style="font-size: 0.9rem;">Enter your VPA / UPI ID:</p>
            <input type="text" placeholder="username@bankname" id="upiId">
        </div>

        <button class="pay-now-btn" id="payBtn" onclick="handleTransaction()">Confirm & Pay ₹1</button>
        
        <div id="loader">
            <div class="spinner"></div>
            <p>Processing Secure Transaction...</p>
        </div>
    </div>
</div>
<script>
async function handleTransaction() {
    const btn = document.getElementById('payBtn');
    const loader = document.getElementById('loader');
    const upiIdInput = document.getElementById('upiId').value; // Get input from your form

    // 1. Validation
    if(!upiIdInput || !upiIdInput.includes('@')) {
        alert("Please enter a valid UPI ID");
        return;
    }

    // 2. UI State Change
    btn.disabled = true;
    btn.innerText = "Opening UPI Apps...";
    loader.style.display = "block";

    // 3. Define Payment Details
    const merchantUpi = "wahink-3@oksbi"; // YOUR real VPA where money will go
    const name = "Your Business Name";
    const amount = "1.00";
    const note = "Payment for UGC API";

    // 4. Create the UPI Deep Link
    const upiUrl = `upi://pay?pa=${merchantUpi}&pn=${encodeURIComponent(name)}&am=${amount}&cu=INR&tn=${encodeURIComponent(note)}`;

    // 5. Execution
    // We use a small timeout so the user sees the "Opening..." state before the redirect
    setTimeout(() => {
        window.location.href = upiUrl;
        
        // Optional: Reset the button after a few seconds in case they come back to the browser
        setTimeout(() => {
            btn.disabled = false;
            loader.style.display = "none";
            btn.innerText = "Confirm & Pay ₹1";
        }, 5000);
    }, 1000);
}
</script>
</body>
</html>
